services:
  # One-shot CLI runner (original)
  court-reserve:
    build: .
    env_file: .env
    environment:
      TZ: America/Los_Angeles
    command: python main.py book-next

  # Web UI + scheduler
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    ports:
      - "7000:8080"
    volumes:
      - court_data:/data
    environment:
      TZ: America/Los_Angeles
      DATA_DIR: /data
    restart: unless-stopped
    # Playwright's chromium children reparent to PID 1 when they exit. Plain python
    # as PID 1 never reaps them, so they pile up as zombies (6941 of them by the time
    # anyone looked). tini reaps them.
    init: true
    # The outage this guards against had the container reporting "Up" the whole time:
    # PID 1 was alive and the port accepted TCP, but no HTTP request ever completed.
    # Only a real request distinguishes those, so hit an actual endpoint and bound it.
    # NOTE: Docker does NOT restart a container for going unhealthy -- `restart:
    # unless-stopped` reacts to *exit*, not health. This surfaces the state (docker ps
    # / DSM both show "unhealthy"); acting on it automatically needs a watchdog,
    # which is not wired up yet -- see "Monitoring" in CLAUDE.md.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=10",
             "--output-document=/dev/null", "http://localhost:8080/"]
      interval: 60s
      timeout: 15s
      retries: 3
      # Startup reschedules every active watch job, each launching its own browser,
      # so first paint is slow. Don't let that count as failure.
      start_period: 180s
    # Synology's default `db` log driver has no rotation. Long-running watch jobs
    # print a poll line every ~60s each, so over weeks the log store grew until the
    # driver stopped draining our stdout pipe: a thread blocked in write(), every
    # other thread queued behind the buffered-writer lock, and the uvicorn event
    # loop stopped answering HTTP while the container still looked "Up".
    # json-file with a hard cap keeps that bounded (5 × 10MB = 50MB max).
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Opts this container in to the autoheal watchdog below.
    labels:
      autoheal: "true"

  # Watchdog: restarts any container labelled autoheal=true when its healthcheck
  # reports unhealthy. Needed because Docker itself does NOT act on health status --
  # `restart: unless-stopped` reacts to process *exit*, and the failure this guards
  # against (blocked event loop, port still open) never exits.
  #
  # It lives outside the web container on purpose: an in-process watchdog would be
  # taken down by the very fault it's meant to catch.
  #
  # SECURITY: mounting docker.sock grants this container full control of the Docker
  # daemon, which is root-equivalent on the NAS. Pinned by digest rather than a
  # floating tag so the image can't change under us; re-pin deliberately to upgrade.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30           # seconds between health polls
      AUTOHEAL_START_PERIOD: 300      # grace after autoheal itself starts (NAS reboot)
      # A wedged app can't service SIGTERM, so Docker will wait out this whole
      # timeout before SIGKILL -- that's the case we're here for. Keep it short,
      # and keep CURL_TIMEOUT well above it: with both at the default 30s the
      # restart call times out exactly as the restart lands, and autoheal logs a
      # failure for a restart that actually worked (observed in testing).
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
      CURL_TIMEOUT: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  court_data:
