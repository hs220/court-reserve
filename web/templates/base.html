<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CourtReserve Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
  <header class="mobile-header">
    <button class="hamburger" id="nav-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-logo">🎾 CR Manager</span>
  </header>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">🎾 CR Manager</div>
    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
    <a href="/orgs" class="nav-link {% if '/orgs' in request.url.path %}active{% endif %}">Organizations</a>
    <a href="/jobs" class="nav-link {% if request.url.path == '/jobs' or (request.url.path.startswith('/jobs/') and 'recurring' not in request.url.path) %}active{% endif %}">Jobs</a>
    <a href="/reservations" class="nav-link {% if '/reservations' in request.url.path %}active{% endif %}">Reservations</a>
    <a href="/recurring" class="nav-link {% if request.url.path == '/recurring' %}active{% endif %}">Recurring</a>
    <a href="/bugs" class="nav-link {% if '/bugs' in request.url.path %}active{% endif %}">Bug Reports</a>
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script>
  (function() {
    var toggle = document.getElementById('nav-toggle');
    var sidebar = document.getElementById('sidebar');
    var backdrop = document.getElementById('sidebar-backdrop');
    function close() { sidebar.classList.remove('open'); backdrop.classList.remove('open'); }
    toggle.addEventListener('click', function() {
      var open = sidebar.classList.toggle('open');
      backdrop.classList.toggle('open', open);
    });
    backdrop.addEventListener('click', close);
    sidebar.querySelectorAll('.nav-link').forEach(function(a) { a.addEventListener('click', close); });
  })();

  document.addEventListener('submit', function(e) {
    var form = e.target;
    var btn = form.querySelector('button[type="submit"][data-loading], button[data-loading]:not([type])');
    if (!btn) btn = form.querySelector('button[type="submit"], button:not([type])');
    if (btn && btn.dataset.loading !== undefined) {
      var label = btn.dataset.loading || 'Working…';
      btn.textContent = label;
      btn.disabled = true;
    }
  });
  </script>
</body>
</html>
